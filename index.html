<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestellapp</title>
    <link rel="shortcut icon" href="./assets/icons/favicon_orange.svg" type="image/x-icon">
    <link rel="stylesheet" href="./styles/variables.css">
    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./styles/standard.css">
    <link rel="stylesheet" href="./styles/components.css">
    <link rel="stylesheet" href="./style.css">
    <script src="./scripts/db.js"></script>
    <script src="./scripts/template.js"></script>
    <script src="./script.js"></script>
</head>

<body id="body" onload="init()"
    onresize="onSiteResize()">
    <header class="header">
        <div class="company-logo-wrapper">
            <img src="./assets/icons/favicon_white.svg" alt="Company logo">
            <img src="./assets/icons/bestell_app.svg" alt="Company logo name">
        </div>
        <img class="burgermenu" src="./assets/icons/bugermenu.svg" alt="Burgermenu logo">
    </header>
    <main>
        <section class="herosection">
            <div class="hero-img-wrapper">
                <img class="hero-img" src="./assets/img/hero.jpg" alt="a table full of ingredients and dishes">
            </div><img class="hero-logo" src="./assets/img/hero_logo.png"
                alt="Cartoon art burger on an orange background">
        </section>
        <section class="restaurant-information">
            <div class="restaurant-information-styling-container">
                <div class="recommondation-wrapper">
                    <img src="./assets/icons/star.svg" alt="darkgrey star logo">
                    <p class="current-rating">4,1</p>
                    <p class="amount-of-ratings">(395)</p>
                </div>
                <h1><span class="highlight">Burger</span> House</h1>
            </div>
            <p>The best of Burgers, Pizza, and Greens, all in one great place.</p>
        </section>
        <article id="menu">
        </article>
        <dialog aria-label="Order Confirmation" id="orderConfirmation" class="order-confirmation" closedby="any">
            <button aria-label="close dialog" onclick="closeDialog()" class="close-btn"><img src="./assets/icons/close.svg"
                    alt="close icon"></button>
            <img src="./assets/img/food_truck.png" alt="orange food truck with an burgerlogo on it">
            <p class="order-confirmation-bold-text">Order confirmed!</p>
            <p>Your food is on the way!</p>
        </dialog>
    </main>
    <footer>
        <a href="./imprint.html">Imprint</a>
        <a href="./index.html">Cookie Preferences</a>
        <div class="copyright-information">
            <img src="./assets/icons/copyright.svg" alt="copyright logo">
            <p>2026 BurgerHouse</p>
        </div>
    </footer>
    <nav class="nav-bar">
        <ul>
            <li><a aria-label="go to start side" href="./index.html" class="nav-link home-link"></a></li>
            <li><a aria-label="open personal data" href="" class="nav-link person-link">
                </a></li>
            <li><a aria-label="open new app" href="" class="nav-link app-link"></a></li>
            <li><button aria-label="open basket" onclick="toggleBasket()" id="basketBtn" class="nav-basket-btn nav-link">
                    <p class="amount-in-basket" id="amountInBasket"></p>
                </button></li>
        </ul>
    </nav>
</body>

</html>
