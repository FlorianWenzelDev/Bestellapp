<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestellapp</title>
    <link rel="shortcut icon" href="./assets/icons/favicon_orange.svg" type="image/x-icon">
    <link rel="stylesheet" href="./styles/variables.css">
    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./styles/standard.css">
    <link rel="stylesheet" href="./styles/components.css">
    <link rel="stylesheet" href="./styles/style.css">
    <script src="./scripts/db.js"></script>
    <script src="./scripts/template.js"></script>
    <script src="./scripts/script.js"></script>
</head>

<body onload="getFromLocalStorage(), renderMenuOnLoad()" onresize="changeBasketHeight()">
    <header class="header">
        <div class="company-logo-wrapper">
            <img src="./assets/icons/favicon_white.svg" alt="Company logo">
            <img src="./assets/icons/bestell_app.svg" alt="Company logo name">
        </div>
        <img class="burgermenu" src="./assets/icons/bugermenu.svg" alt="Burgermenu logo">
    </header>
    <main>
        <section class="herosection">
            <div class="hero-img-wrapper">
                <img class="hero-img" src="./assets/img/hero.jpg" alt="a table full of ingredients and dishes">
            </div><img class="hero-logo" src="./assets/img/hero_logo.png"
                alt="Cartoon art burger on an orange background">
        </section>
        <section class="restaurant-information">
            <div class="restaurant-information-styling-container">
                <div class="recommondation-wrapper">
                    <img src="./assets/icons/star.svg" alt="darkgrey star logo">
                    <p class="current-rating">4,1</p>
                    <p class="amount-of-ratings">(395)</p>
                </div>
                <h1><span class="highlight">Burger</span> House</h1>
            </div>
            <p>The best of Burgers, Pizza, and Greens, all in one great place.</p>
        </section>
        <article id="menu">
        </article>
        <dialog id="mobileBasket" class="basket">
            <button onclick="toogleBasket()" class="close-btn"><img src="./assets/icons/close.svg"
                    alt="close icon"></button>
            <h2>Your Basket</h2>
            <div class="basket-styling-container">
                <div id="emptyBasketStyling" class="empty-basket-styling">
                    <p>Nothing here yet. <br> Go ahead and choose something delicious!</p>
                    <img src="./assets/icons/shopping_cart_beige.svg" alt="shopping cart icon">
                </div>
                <ul id="listOfBasketArticles" class="list-of-basket-articles">
                </ul>
                <table id="pricingTable" class="pricing-table">
                    <tbody>
                        <tr>
                            <td class="position-text">Subtotal</td>
                            <td id="subtotalSum" class="price-text">23.10€</td>
                        </tr>
                        <tr>
                            <td class="position-text">Delivery fee</td>
                            <td id="deliveryFee" class="price-text">4.90€</td>
                        </tr>
                        <tr>
                            <td class="position-text table-total">Total</td>
                            <td id="totalSum" class="price-text table-total"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <button id="basketBuyButton" class="basket-btn">Buy now</button>
        </dialog>
    </main>
    <footer>
        <a href="./imprint.html">Imprint</a>
        <a href="./index.html">Cookie Preferences</a>
        <div class="copyright-information">
            <img src="./assets/icons/copyright.svg" alt="copyright logo">
            <p>2026 BurgerHouse</p>
        </div>
    </footer>
    <nav class="nav-bar">
        <ul>
            <li><a href="./index.html"><img src="./assets/icons/home_white.svg" alt="home icon"></a></li>
            <li><a href=""><img src="./assets/icons/person.svg" alt="person icon"></a></li>
            <li><a href=""><img src="./assets/icons/favicon_white.svg" alt="company logo"></a></li>
            <li><button onclick="toogleBasket()" id="basketBtn">
                    <img src="./assets/icons/shopping_cart_white.svg" alt="shopping cart icon">
                </button></li>
        </ul>
    </nav>
</body>

</html>
